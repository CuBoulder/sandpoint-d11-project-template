---
type: drupal11
docroot: web
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: [ ]
additional_fqdns: [ ]
database:
    type: mariadb
    version: "10.11"
use_dns_when_possible: true
composer_version: "2"
web_environment:
  - DDEV_PANTHEON_SITE=ucbprod-demos-documentation
  - DDEV_PANTHEON_ENVIRONMENT=live
  - DDEV_USE_PANTHEON_BACKUP=true

corepack_enable: false

hooks:
  post-pull:
    - exec: bash /var/www/html/.ddev/scripts/after-pull.sh

# See https://ddev.readthedocs.io/en/stable/users/configuration/config for more
